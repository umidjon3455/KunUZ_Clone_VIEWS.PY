<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>News</title>
    <style>
        body {
            background: #0d6efd;
            font-family: Arial;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: auto;
        }
        .news-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }
        .news-card img {
            width: 220px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        .category {
            color: #0d6efd;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>📰 Yangiliklar</h1>

<div class="container">
    {% for news in news_list %}
<div class="news-card">
    {% if news.image %}
        <img src="{{ news.image.url }}" alt="news image">
    {% endif %}

    <div>
        <div class="category">{{ news.category }}</div>
        <h2>{{ news.title }}</h2>
        <p>{{ news.body|truncatewords:30 }}</p>
    </div>
</div>

    {% endfor %}
</div>

</body>
</html>
